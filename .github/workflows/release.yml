name: Release

on:
  push:
    tags: ['v*']

# The tag is the trigger, so the version in the tag and the version in the
# three manifests must already agree — the job checks rather than assumes.
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Version matches the tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in package.json src-tauri/tauri.conf.json; do
            found=$(grep -m1 '"version"' "$file" | sed 's/.*"version"[^"]*"\([^"]*\)".*/\1/')
            [ "$found" = "$tag" ] || { echo "$file says $found, tag says $tag"; exit 1; }
          done
          found=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          [ "$found" = "$tag" ] || { echo "Cargo.toml says $found, tag says $tag"; exit 1; }

      # The notes have to come from the repository, not from the draft. This
      # job creates the release, builds, and uploads `latest.json` with the
      # notes baked into it — so anything typed into the draft afterwards is
      # already too late to reach the in-app updater.
      - name: Release notes for this tag
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$tag" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $tag — add one before tagging."
            exit 1
          fi

          {
            echo "body<<GROOVIUM_NOTES_EOF"
            printf '%s\n' "$notes"
            echo "GROOVIUM_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both are optional. Without them the installer is unsigned, which
          # Windows answers with a SmartScreen warning — see the release notes
          # in README.md for what that costs and how to fix it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Groovium ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
