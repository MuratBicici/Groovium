[package]
name = "groovium"
version = "1.0.4"
description = "A lightweight, modern desktop music player widget with a vintage disk player aesthetic."
authors = ["Murat Emre Bicici"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for `transparent: true` to work on macOS.
# `protocol-asset` backs `convertFileSrc()`, which is how local audio files reach
# the webview; it must stay in sync with `assetProtocol.enable` in tauri.conf.json.
# `tray-icon` is what makes this a widget rather than just a small window:
# closing the window hides to the tray instead of ending playback.
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"

# OS integration. Media keys and the tray are registered on this side so the
# webview needs no additional permissions for either.
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"


# Spotify OAuth. `rustls` rather than the platform TLS stack so building on
# Linux does not need OpenSSL headers.
# `form` is the token endpoint's encoding; `json` is for the profile response.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
tiny_http = "0.12"
sha2 = "0.11"
getrandom = "0.4"

# OS credential store: DPAPI on Windows, Keychain on macOS, Secret Service on
# Linux. Default features pull in the native backend for each platform, which is
# the whole point — secrets must never land in a file we manage.
keyring = "4"

# Audio tag reading: ID3v2, Vorbis comments, MP4 ilst, APE. Also yields track
# duration from the file header, which is far cheaper and more reliable than
# loading each file into a throwaway <audio> element to measure it.
lofty = "0.25"
walkdir = "2"
base64 = "0.22"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Updating in place. The updater downloads and verifies in Rust, so the
# webview's CSP has nothing to do with it and no host needs allowing there.
# `process` is only for the relaunch afterwards: an installer that has replaced
# the running binary needs the app started again for any of it to take effect.
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[features]
# Enabled by `tauri dev`; keeps devtools available in debug builds only.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
